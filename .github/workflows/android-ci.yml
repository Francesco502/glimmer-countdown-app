name: Android CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle wrapper mode
        run: test -x ./gradlew

      - name: Test, lint, and build debug channels
        run: >-
          ./gradlew --no-daemon --no-parallel
          testDirectDebugUnitTest
          testPlayDebugUnitTest
          compileDirectDebugAndroidTestKotlin
          lintDirectDebug
          lintDirectRelease
          lintPlayRelease
          lintVitalDirectRelease
          lintVitalPlayRelease
          assembleDirectDebug
          assemblePlayDebug
