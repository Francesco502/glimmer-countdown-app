# App version
VERSION_CODE=23
VERSION_NAME=4.0

org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=2g
org.gradle.daemon=true
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false
android.r8.strictFullModeForKeepRules=false
# Required by KSP 2.3.2 with AGP 9.1 built-in Kotlin: Room's generated sources are
# still registered through kotlin.sourceSets. Remove after KSP stops registering generated sources through kotlin.sourceSets.
android.disallowKotlinSourceSets=false
kotlin.compiler.execution.strategy=in-process
